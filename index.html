<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antique Dashboard - Spreadsheet Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --body-bg: #d1c4ab; 
            --card-bg: #f5ede0; 
            --text-main: #3d2e1f;
            --border-color: #8b7355;
            --accent-tan: #c9a875;
            --header-bg: #e8dcc4;
        }

        body { font-family: 'Georgia', serif; margin: 0; background-color: var(--body-bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--body-bg); display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .login-card { background: var(--card-bg); padding: 40px; border: 2px solid var(--border-color); border-radius: 12px; text-align: center; }
        .login-card input { display: block; width: 220px; padding: 10px; margin: 10px auto; border: 1.5px solid var(--border-color); border-radius: 5px; }
        .login-btn { padding: 10px 20px; background: var(--text-main); color: white; border: none; border-radius: 5px; cursor: pointer; }

        /* --- LEFT SIDEBAR (PLAYLIST) --- */
        .sidebar { width: 350px; background-color: #f0e8da; border-right: 2px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .playlist-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .playlist-table th, .playlist-table td { border: 1px solid var(--border-color); padding: 10px; text-align: left; font-size: 13px; }
        .playlist-table th { background: var(--header-bg); }
        .playlist-table input { width: 90%; border: none; background: transparent; font-family: inherit; color: inherit; }

        /* --- MAIN AREA (TIMETABLE) --- */
        #main-app { display: none; width: 100%; }
        #wallpaper-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px; overflow-y: auto; }
        
        .header-box { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .date-display { font-size: 28px; font-weight: bold; border-bottom: 2px solid var(--border-color); }

        .spreadsheet-container { width: 100%; max-width: 900px; background: var(--card-bg); border: 2px solid var(--border-color); border-collapse: collapse; display: table; }
        
        /* Grid Structure */
        .grid-header { display: grid; grid-template-columns: 100px 1fr 1fr; background: var(--header-bg); border-bottom: 2px solid var(--border-color); }
        .grid-row { display: grid; grid-template-columns: 100px 1fr 1fr; border-bottom: 1px solid var(--border-color); min-height: 60px; }
        .grid-cell { border-right: 1px solid var(--border-color); padding: 10px; display: flex; flex-direction: column; gap: 5px; position: relative; }
        .grid-cell:last-child { border-right: none; }

        .time-col { background: #eee5d8; font-weight: bold; text-align: center; align-items: center; justify-content: center; font-size: 12px; }
        .day-label { font-weight: bold; text-align: center; padding: 15px; font-size: 16px; }

        .task-entry { background: rgba(255,255,255,0.5); border: 1px solid #c9a875; padding: 4px 8px; font-size: 12px; border-radius: 3px; display: flex; justify-content: space-between; }
        .task-entry span.del { color: red; cursor: pointer; margin-left: 10px; }

        .controls { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>Roshman Timetable</h2>
        <input type="password" id="pass" placeholder="Enter Password">
        <button class="login-btn" onclick="checkLogin()">Login</button>
    </div>
</div>

<div id="main-app">
    <div class="controls">
        <button class="login-btn" onclick="downloadWallpaper()">Download</button>
        <button class="login-btn" style="background:#8b7355" onclick="location.reload()">Logout</button>
    </div>

    <aside class="sidebar">
        <h2>Music Playlist</h2>
        <table class="playlist-table">
            <thead>
                <tr><th width="40">#</th><th>Track Name</th><th width="30"></th></tr>
            </thead>
            <tbody id="playlistBody"></tbody>
        </table>
        <button class="login-btn" style="margin-top:15px; width:100%" onclick="addTrack()">+ Add Track</button>
    </aside>

    <main id="wallpaper-wrapper">
        <div class="header-box">
            <div class="date-display" id="dateText">2026/01/05</div>
            <div id="clockText" style="font-weight: bold;">00:00:00</div>
        </div>

        <div class="spreadsheet-container" id="captureArea">
            <div class="grid-header" id="gridHeader">
                </div>
            <div id="gridBody">
                </div>
        </div>
    </main>
</div>

<script>
    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const TIMES = ["04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];
    let isGuest = false;

    function checkLogin() {
        if(document.getElementById('pass').value === "1997") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            initApp();
        }
    }

    function initApp() {
        renderGridHeaders();
        renderGridRows();
        loadData();
        updateClock();
        setInterval(updateClock, 1000);
    }

    function renderGridHeaders() {
        const now = new Date();
        const tomorrow = new Date(); tomorrow.setDate(now.getDate() + 1);
        
        const header = document.getElementById('gridHeader');
        header.innerHTML = `
            <div class="day-label time-col">TIME</div>
            <div class="day-label">${DAYS[now.getDay()]} (Today)</div>
            <div class="day-label">${DAYS[tomorrow.getDay()]} (Tomorrow)</div>
        `;
        document.getElementById('dateText').innerText = now.toISOString().split('T')[0].replace(/-/g, '/');
    }

    function renderGridRows() {
        const body = document.getElementById('gridBody');
        body.innerHTML = '';
        TIMES.forEach(time => {
            const row = document.createElement('div');
            row.className = 'grid-row';
            row.innerHTML = `
                <div class="grid-cell time-col">${time}</div>
                <div class="grid-cell slot" data-time="${time}" data-day="today" onclick="addTask(this)"></div>
                <div class="grid-cell slot" data-time="${time}" data-day="tomorrow" onclick="addTask(this)"></div>
            `;
            body.appendChild(row);
        });
    }

    // --- TASK LOGIC ---
    function addTask(cell) {
        const task = prompt("Enter Task:");
        if (task) {
            const div = document.createElement('div');
            div.className = 'task-entry';
            div.innerHTML = `<span>${task}</span><span class="del" onclick="event.stopPropagation(); this.parentElement.remove(); saveAll();">×</span>`;
            cell.appendChild(div);
            saveAll();
        }
    }

    // --- PLAYLIST LOGIC ---
    function addTrack(name = "") {
        const tbody = document.getElementById('playlistBody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${tbody.rows.length + 1}</td>
            <td><input type="text" value="${name}" placeholder="Track..." onchange="saveAll()"></td>
            <td><span style="color:red; cursor:pointer" onclick="this.closest('tr').remove(); saveAll();">×</span></td>
        `;
        tbody.appendChild(row);
    }

    // --- STORAGE ---
    function saveAll() {
        const data = { tasks: {}, playlist: [] };
        document.querySelectorAll('.slot').forEach((slot, i) => {
            const tasks = [];
            slot.querySelectorAll('.task-entry span:first-child').forEach(s => tasks.push(s.innerText));
            data.tasks[i] = tasks;
        });
        document.querySelectorAll('#playlistBody input').forEach(input => data.playlist.push(input.value));
        localStorage.setItem('dashboard_data', JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem('dashboard_data');
        if (!saved) return;
        const data = JSON.parse(saved);
        
        const slots = document.querySelectorAll('.slot');
        Object.keys(data.tasks).forEach(idx => {
            data.tasks[idx].forEach(txt => {
                const div = document.createElement('div');
                div.className = 'task-entry';
                div.innerHTML = `<span>${txt}</span><span class="del" onclick="event.stopPropagation(); this.parentElement.remove(); saveAll();">×</span>`;
                slots[idx].appendChild(div);
            });
        });
        data.playlist.forEach(t => addTrack(t));
    }

    function updateClock() {
        document.getElementById('clockText').innerText = new Date().toLocaleTimeString();
    }

    function downloadWallpaper() {
        const area = document.getElementById('captureArea');
        html2canvas(area, { backgroundColor: '#d1c4ab', scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'timetable.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>

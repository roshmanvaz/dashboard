<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antique Timetable - Guest & Admin Access</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --body-bg: #d1c4ab; 
            --primary-bg: #d1c4ab; 
            --card-bg: #f5ede0; 
            --text-main: #3d2e1f;
            --border-color: #8b7355;
            --marker-red: #a32a2a; 
            --accent-tan: #c9a875;
            --color-sat: #d4c4b0;
            --color-sun: #c9a875;
        }

        /* --- LOGIN STYLES --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--body-bg);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px; border: 2px solid var(--border-color); border-radius: 12px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login-card input {
            display: block; width: 220px; padding: 10px; margin: 10px auto;
            border: 1.5px solid var(--border-color); border-radius: 5px;
        }

        .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        
        .login-btn { padding: 10px 20px; background: var(--text-main); color: white; border: none; border-radius: 5px; cursor: pointer; }
        .guest-btn { padding: 10px 20px; background: transparent; color: var(--text-main); border: 1.5px solid var(--text-main); border-radius: 5px; cursor: pointer; }

        /* --- MAIN APP --- */
        #main-app { display: none; width: 100%; min-height: 100vh; }
        body { font-family: 'Georgia', serif; margin: 0; background-color: var(--body-bg); color: var(--text-main); display: flex; }

        /* --- PLAYLIST SIDEBAR --- */
        .sidebar { width: 320px; background-color: #f0e8da; border-right: 2px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .playlist-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .playlist-table th, .playlist-table td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        .playlist-table th { background: var(--accent-tan); color: white; }
        .playlist-table td input { width: 90%; border: none; background: transparent; font-family: inherit; color: inherit; }
        .add-track-btn { margin-top: 15px; padding: 10px; background: var(--text-main); color: white; border: none; border-radius: 5px; cursor: pointer; text-align: center; font-weight: bold; }

        /* --- TIMETABLE AREA --- */
        #wallpaper-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; background-color: var(--primary-bg); padding: 20px; }
        .timetable-container { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 12px; border: 2px solid var(--border-color); padding: 40px; position: relative; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .date-title { font-size: 32px; }
        .clock-box { font-size: 18px; border: 1.5px solid var(--border-color); padding: 10px 20px; background: rgba(255,255,255,0.3); border-radius: 5px; }

        /* SPREADSHEET STYLE GRID: Time | Day 1 | Day 2 */
        .timetable-grid { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 0; border: 1px solid var(--border-color); }
        .day-label, .time-label { text-align: center; padding: 12px 5px; background: #e8dcc4; border: 1px solid var(--border-color); font-weight: bold; font-size: 14px; }
        .day-label.sat { background-color: var(--color-sat); }
        .day-label.sun { background-color: var(--color-sun); color: white; }
        
        .time-cell { border: 1px solid var(--border-color); background: #eee5d8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .slot { min-height: 100px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.2); padding: 8px; display: flex; flex-direction: column; gap: 5px; }
        .span-row-full { grid-column: span 3; text-align: center; padding: 10px; background: rgba(212, 165, 116, 0.3); border: 1px solid var(--border-color); font-style: italic; font-weight: bold; }
        
        .placed-task { background: rgba(240, 230, 210, 0.9); border: 1px solid var(--border-color); padding: 4px 8px; font-size: 13px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }

        .controls { position: fixed; top: 20px; right: 20px; z-index: 100; }
        .guest-badge { position: fixed; bottom: 20px; left: 340px; background: #a32a2a; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>Antique Timetable</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div class="btn-row">
            <button class="login-btn" onclick="checkLogin()">Login</button>
            <button class="guest-btn" onclick="guestLogin()">Guest View</button>
        </div>
        <p id="error-msg" style="color: #a32a2a; display: none; margin-top: 15px;">Invalid Roshman Credentials</p>
    </div>
</div>

<div id="main-app">
    <div class="guest-badge" id="guestBadge">Guest Mode: Changes will not be saved</div>
    <div class="controls">
        <button class="login-btn" onclick="downloadWallpaper()">Download Wallpaper</button>
        <button class="guest-btn" onclick="logout()">Logout</button>
    </div>

    <aside class="sidebar">
        <h2>Music Playlist</h2>
        <table class="playlist-table" id="playlistTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Track Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="playlistBody"></tbody>
        </table>
        <button class="add-track-btn" onclick="addTrack()">+ Add Track</button>
    </aside>

    <main id="wallpaper-wrapper">
        <div class="timetable-container">
            <div class="header-row">
                <div class="date-title" id="currentDateTitle"></div>
                <div class="clock-box" id="clockDisplay"></div>
            </div>
            <div class="timetable-grid" id="dynamicGrid"></div>
        </div>
    </main>
</div>

<script>
    let isGuest = false;
    const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === "roshman" && p === "1997") {
            isGuest = false;
            sessionStorage.setItem('userType', 'admin');
            showApp();
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    function guestLogin() {
        isGuest = true;
        sessionStorage.setItem('userType', 'guest');
        showApp();
    }

    function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        if(isGuest) document.getElementById('guestBadge').style.display = 'block';
        
        loadPlaylist();
        renderSpreadsheetGrid();
        loadGrid();
        updateClockAndMarker();
    }

    function logout() { sessionStorage.clear(); location.reload(); }
    function conditionalSave() { if (!isGuest) { savePlaylist(); saveGrid(); } }

    // --- PLAYLIST LOGIC ---
    function addTrack(name = "") {
        const tbody = document.getElementById('playlistBody');
        const rowCount = tbody.rows.length + 1;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${rowCount}</td>
            <td><input type="text" value="${name}" placeholder="Track Name..." onchange="conditionalSave()"></td>
            <td style="text-align:center"><span style="color:red; cursor:pointer" onclick="this.parentElement.parentElement.remove(); updateTrackNumbers(); conditionalSave();">×</span></td>
        `;
        tbody.appendChild(tr);
        conditionalSave();
    }

    function updateTrackNumbers() {
        document.querySelectorAll('#playlistBody tr').forEach((tr, i) => { tr.cells[0].innerText = i + 1; });
    }

    function savePlaylist() {
        const tracks = [];
        document.querySelectorAll('#playlistBody tr').forEach(tr => {
            const val = tr.querySelector('input').value;
            if(val) tracks.push(val);
        });
        localStorage.setItem('playlistData', JSON.stringify(tracks));
    }

    function loadPlaylist() {
        const saved = isGuest ? null : localStorage.getItem('playlistData');
        const tracks = saved ? JSON.parse(saved) : ["Deep Focus", "Piano Gold"];
        document.getElementById('playlistBody').innerHTML = '';
        tracks.forEach(t => addTrack(t));
    }

    // --- SPREADSHEET STYLE GRID LOGIC ---
    function renderSpreadsheetGrid() {
        const now = new Date();
        const colombo = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (5.5 * 3600000));
        const todayIdx = colombo.getDay();
        const tomorrowIdx = (todayIdx + 1) % 7;

        const grid = document.getElementById('dynamicGrid');
        
        // Header Row
        grid.innerHTML = `
            <div class="time-label">Time</div>
            <div class="day-label ${todayIdx === 6 ? 'sat' : ''} ${todayIdx === 0 ? 'sun' : ''}">${DAYS[todayIdx]} (Today)</div>
            <div class="day-label ${tomorrowIdx === 6 ? 'sat' : ''} ${tomorrowIdx === 0 ? 'sun' : ''}">${DAYS[tomorrowIdx]} (Tomorrow)</div>
            
            <div class="span-row-full">Morning Reset</div>
            
            <div class="time-cell">AM</div>
            <div class="slot" data-slot-id="${todayIdx}_AM" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <div class="slot" data-slot-id="${tomorrowIdx}_AM" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            
            <div class="time-cell">PM</div>
            <div class="slot" data-slot-id="${todayIdx}_PM" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <div class="slot" data-slot-id="${tomorrowIdx}_PM" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

            <div class="span-row-full">Sleep Time</div>
        `;
    }

    function saveGrid() {
        const gridData = JSON.parse(localStorage.getItem('focusGrid') || "{}");
        document.querySelectorAll('.slot').forEach(slot => {
            const slotId = slot.getAttribute('data-slot-id');
            const slotTasks = [];
            slot.querySelectorAll('.placed-task span:first-child').forEach(span => slotTasks.push(span.innerText));
            gridData[slotId] = slotTasks;
        });
        localStorage.setItem('focusGrid', JSON.stringify(gridData));
    }

    function loadGrid() {
        if(isGuest) return;
        const saved = localStorage.getItem('focusGrid');
        if (!saved) return;
        const gridData = JSON.parse(saved);
        document.querySelectorAll('.slot').forEach(slot => {
            const slotId = slot.getAttribute('data-slot-id');
            if (gridData[slotId]) gridData[slotId].forEach(taskName => createPlacedTask(slot, taskName));
        });
    }

    function createPlacedTask(parent, name) {
        const div = document.createElement('div');
        div.className = 'placed-task';
        div.innerHTML = `<span>${name}</span><span style="cursor:pointer; color:#a32a2a" onclick="this.parentElement.remove(); conditionalSave();">×</span>`;
        parent.appendChild(div);
    }

    function allowDrop(ev) { ev.preventDefault(); }
    function drop(ev) {
        ev.preventDefault();
        const data = prompt("Add Task:");
        const slot = ev.target.closest('.slot');
        if (slot && data) { createPlacedTask(slot, data); conditionalSave(); }
    }

    function updateClockAndMarker() {
        const now = new Date();
        const colombo = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (5.5 * 3600000));
        document.getElementById('clockDisplay').textContent = colombo.toLocaleTimeString();
        document.getElementById('currentDateTitle').textContent = colombo.toISOString().split('T')[0].replace(/-/g,'/');
    }

    function downloadWallpaper() {
        const dateHeader = document.getElementById('currentDateTitle');
        const deletes = document.querySelectorAll('.placed-task span:last-child, #playlistBody span');
        
        dateHeader.style.visibility = 'hidden';
        deletes.forEach(btn => btn.style.display = 'none');

        html2canvas(document.getElementById('main-app'), { scale: 2, backgroundColor: '#d1c4ab' }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Dashboard.png`;
            link.href = canvas.toDataURL();
            link.click();

            dateHeader.style.visibility = 'visible';
            deletes.forEach(btn => btn.style.display = 'inline');
        });
    }

    setInterval(updateClockAndMarker, 1000);
    window.onload = () => {
        const status = sessionStorage.getItem('userType');
        if (status) { isGuest = (status === 'guest'); showApp(); }
    };
</script>
</body>
</html>

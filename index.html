<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link rel="icon" type="image/png" href="https://via.placeholder.com/32">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAyNLJDbHJweH61mRhRToqfla3e6LSdefE",
          authDomain: "antique-timetable.firebaseapp.com",
          projectId: "antique-timetable",
          storageBucket: "antique-timetable.firebasestorage.app",
          messagingSenderId: "436252284092",
          appId: "1:436252284092:web:ea4a075a24a0ae009cacb9",
          measurementId: "G-EHKFF82NPZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CORRECT_PASSWORD = "1997";

        // Password Check Function
        window.loginWithPassword = async function() {
            const pass = prompt("Enter Access Code:");
            if (pass === CORRECT_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                initApp();
            } else {
                alert("Incorrect Password.");
            }
        };

        window.logout = () => {
            sessionStorage.clear();
            location.reload();
        };

        async function initApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            await window.loadFromCloud();
            updateClockAndMarker();
        }

        // Check login status on load
        window.onload = () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                initApp();
            }
        };

        window.saveToCloud = async function() {
            if (sessionStorage.getItem('isLoggedIn') !== 'true') return; 
            const sidebarTasks = [];
            document.querySelectorAll('#sidebarTasks .task-item span:first-child').forEach(span => sidebarTasks.push(span.innerText));
            const gridData = {}; 
            document.querySelectorAll('.slot').forEach((slot, index) => {
                const slotTasks = [];
                slot.querySelectorAll('.placed-task span:first-child').forEach(span => slotTasks.push(span.innerText));
                if (slotTasks.length > 0) {
                    gridData[`slot_${index}`] = slotTasks;
                }
            });
            try {
                await setDoc(doc(db, "users", "roshman"), {
                    sidebar: sidebarTasks,
                    grid: gridData,
                    lastUpdated: new Date()
                });
            } catch (e) { console.error("Cloud Error: ", e); }
        };

        window.loadFromCloud = async function() {
            try {
                const docSnap = await getDoc(doc(db, "users", "roshman"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    renderSidebar(data.sidebar || []);
                    renderGrid(data.grid || {});
                }
            } catch (e) { console.error("Load Error: ", e); }
        };
    </script>
    ```
